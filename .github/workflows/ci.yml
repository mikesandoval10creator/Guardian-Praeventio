name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
      contents: read
      pull-requests: read

# Cancel in-progress runs when a new commit is pushed to the same PR.
# This prevents stale CI runs from hogging runner capacity.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Secret scanning (gitleaks).
  # 2026-08-06 — CI hardening (Oleada 0 #0.2, Daniel-authorised). Guardian
  # handles WebAuthn credentials, KEK envelopes, session tokens, GCP/Firebase
  # service-account keys — any secret leaked in a commit becomes a
  # credential-theft vulnerability. Gitleaks scans the working tree and
  # PR diff for ~120 secret patterns (AWS, GCP, Firebase, Stripe, GitHub
  # PATs, OpenAI, private keys, etc.) and fails the build on any hit.
  #
  # We use the official action (gitleaks/gitleaks-action@v2) with the
  # upstream default ruleset. Custom rules land in .gitleaks.toml (out of
  # scope for this PR — the default ruleset catches >95% of real leaks).
  #
  # Position in CI: runs FIRST so a leak fails the job before we waste
  # 30 minutes on npm ci / build / tests.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so gitleaks can scan merge commits and old
          # branches in a push event. For PRs the default is fine.
          fetch-depth: 0

      - name: Run gitleaks (with local allowlist)
        uses: gitleaks/gitleaks-action@v2
        with:
          # Local config (`.gitleaks.toml` at repo root) provides the
          # upstream default ruleset + our narrow allowlist for
          # known test fixtures (piiRedactor.test.ts uses fake
          # API-key-shaped strings as PII redactor input). A real leak
          # in any other file or any other rule will still fail CI.
          config_path: .gitleaks.toml
        env:
          # gitleaks-action@v2 requires GITHUB_TOKEN explicitly when
          # scanning pull requests (added in newer versions of the action).
          # Without this, the job fails with "GITHUB_TOKEN is now required
          # to scan pull requests".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is optional (only used by org-mode). Empty
          # string falls back to "individual user" mode (no license needed).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Enable uploads of the SARIF report to the Security tab.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
  verify-roles:
    name: RBAC roles sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Verify src/types/roles.ts and firestore.rules agree
        run: node scripts/verify-roles-sync.cjs

  lint:
    # AUDIT-2026-06 B19 — CLAUDE.md afirmaba que CI corre lint, pero no
    # existía job (y `npm run lint` llevaba tiempo roto: el parser del
    # plugin firestore no es serializable con --cache). Gate de ERRORES
    # solamente — las ~2.4k warnings son deuda conocida con política de
    # promoción a strict gate en Fase F (ver eslint.config.js header).
    name: ESLint (errors gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ESLint src + server + firestore.rules
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript typecheck
        run: npm run typecheck:ci
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  test:
    name: Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # fix/ci-tests-unblock-deploy-2026-06-22 — the full suite grew to ~14 min
    # total (>1 500 test files), which caused the previous single-job 14-min
    # watchdog to fire on EVERY run (both attempts). Root cause: SLOW, not a
    # true hang. Fix: 4-way matrix shard; each shard runs ~3-4 min, well inside
    # the 10-min watchdog below. The `test-pass` aggregator job (below) is
    # `needs`-ed by downstream jobs so the gate still holds.
    timeout-minutes: 30
    strategy:
      fail-fast: true   # fail all shards if one shard has test failures
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Each shard runs 1/4 of the test files. vitest's --shard flag splits
      # the file list deterministically by index, so coverage is complete
      # across the 4 shards. The 10-min watchdog is generous for a ~3-4 min
      # shard; a real freeze (not slow runtime) still fails fast.
      - name: Run vitest shard ${{ matrix.shard }}/4
        run: |
          set +e
          timeout 10m node --max-old-space-size=4096 ./node_modules/vitest/vitest.mjs run \
            --test-timeout=30000 \
            --shard=${{ matrix.shard }}/4
          rc=$?
          if [ $rc -eq 124 ]; then
            echo "::warning::vitest shard ${{ matrix.shard }}/4 pool hang detected (>10m) — retrying once"
            timeout 10m node --max-old-space-size=4096 ./node_modules/vitest/vitest.mjs run \
              --test-timeout=30000 \
              --shard=${{ matrix.shard }}/4
            rc=$?
          fi
          exit $rc
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Aggregator: downstream jobs (build, deploy) need a single gate.
  # All 4 shards must pass before this job turns green.
  test-pass:
    name: Tests (all shards passed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - run: echo "All test shards passed"

  validate-env:
    # Bucket U.5 — env-var shape check. We use --mode test so this job
    # passes against the .env.example template (placeholders allowed,
    # optional vars skipped). Real prod secrets live in deploy-only
    # GitHub secrets and are validated at boot via the package.json
    # "start" path consuming "validate:env" without --mode test.
    name: Validate env
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate env shape (test mode tolerates placeholders)
        run: node scripts/validate-env.cjs --mode test

  rules-tests:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install firebase-tools (provides Firestore emulator)
        run: npm install -g firebase-tools

      - name: Run rules tests against emulator
        # `firebase emulators:exec` boots the Firestore emulator, runs the
        # provided command, then tears it down. The project ID must match the
        # PROJECT_ID constant in src/rules-tests/firestore.rules.test.ts.
        #
        # 2026-05-15: usa la config dedicada `vitest.rules.config.ts` porque
        # la config default excluye `src/rules-tests/**` (esos tests
        # requieren emulator). Sin --config el workflow falla con "No test
        # files found" porque vitest aplica el exclude antes que el filter.
        # 2026-06-09: añadido `storage` al boot — `storageRules.rules.test.ts`
        # corre contra el Storage emulator (firebase.json :9199). Sin esto el
        # test falla con "storage emulator is not running". Mirror de
        # `npm run test:rules` (package.json).
        run: firebase emulators:exec --only firestore,storage --project praeventio-rules-test "npx vitest run --config vitest.rules.config.ts"

  firestore-stores:
    # Plan 2026-05-23 §Fase C — tests de stores client-side (factory
    # `createProjectScopedStore<T>` + 14 stores Sprint K migrados en B.4)
    # contra el Firestore Emulator real. Decisión usuario 2026-05-23:
    # emulator real (lento, fiel) en vez de mocks.
    #
    # Distinto del `rules-tests` job: usa `firebase-admin` (bypass de
    # rules) porque testea LÓGICA de stores, no las security rules.
    name: Firestore stores tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install firebase-tools (provides Firestore emulator)
        run: npm install -g firebase-tools

      - name: Run firestore-stores tests against emulator
        # PROJECT_ID = 'praeventio-test' coincide con el default de
        # `src/test/firestore-emulator-setup.ts`. La config dedicada
        # `vitest.firestore.config.ts` incluye SOLO `*.firestore.test.ts`
        # (la default los excluye porque requieren emulator).
        #
        # `--config firebase.emulator-tests.json` arranca el emulador con
        # reglas ABIERTAS (firestore.test.rules) porque estos stores usan el
        # CLIENT SDK (sujeto a reglas) y el cliente de test NO está autenticado
        # → con las reglas de prod (default-deny) toda op daba 7 PERMISSION_
        # DENIED. Acá testeamos la LÓGICA del store, no las reglas (esas tienen
        # su propio job `Firestore rules tests` contra firestore.rules real).
        run: firebase emulators:exec --config firebase.emulator-tests.json --only firestore --project praeventio-test "npx vitest run --config vitest.firestore.config.ts"

  adr-0012-enforcement:
    # Sprint 26 Bucket XX — ADR 0012 (no diagnosis) automated enforcement.
    # Replays the pre-commit hook against changed files in the PR so a contributor
    # who used --no-verify can't sneak diagnostic code past review.
    name: "ADR 0012 — no diagnosis enforcement"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Stage diff and run medical guard
        env:
          # PR checkout points at a synthetic merge commit; its first parent is
          # the base. Pushes to main compare the new commit with its parent.
          MEDICAL_GUARD_DIFF_BASE: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          # CI inspects the committed base...HEAD range directly. It must not
          # mutate the index: ignored-but-tracked design docs and whitespace in
          # paths made the old `xargs git add` bootstrap fail before the guard.
          node scripts/precommit-medical-guard.cjs

      - name: Run medical guard unit tests
        run: node --test src/__tests__/scripts/medicalGuard.test.cjs

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: typecheck
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # B14: CI validation lanes don't ship the bundle — skip the
          # 483 MB SLM prepackage download. Release/deploy lanes MUST
          # run the real prepackage (they don't set this).
          SLM_PREPACKAGE_SKIP: '1'

  # Dependency vulnerability audit (npm audit) — BLOCKING.
  # 2026-08-06 — CI hardening (Oleada 0 #0.4, Daniel-authorised).
  #
  # Fails the PR if any CRITICAL CVE is present in the dependency tree.
  # Today (audit --audit-level=critical): 2 CVEs ship silently:
  #   - tar (node-tar) GHSA-vmf3-w455-68vh — PAX header override
  #   - websocket-driver GHSA-mp7j-qc5w-4988 — resource limit bypass
  # The first run of this gate after merge will FAIL until those are
  # addressed via npm overrides in package.json. Follow-up tickets
  # will bump these deps and re-enable the merge.
  #
  # 14 additional HIGH CVEs also ship silently (axios, js-yaml, form-data,
  # sharp, react-router, brace-expansion, etc.) — tracked as backlog.
  # Once cleared, raise the threshold to `--audit-level=high` (one-line).
  #
  # The artifact `npm-audit-report.json` is uploaded with retention 30d
  # so reviewers can inspect the full advisory list (not just threshold
  # violations). Threshold enforcement uses a final grep + node one-liner
  # to fail the job with `::error::` and list the offending packages.
  npm-audit:
    name: Dependency vulnerability audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `--ignore-scripts` (added by PR #1401) prevents postinstall scripts
        # from running. `--no-audit` skips npm's built-in audit (we run
        # our own with --json below). `--prefer-offline` reuses the cache.
        run: npm ci --ignore-scripts --no-audit --prefer-offline

      - name: Run npm audit (JSON)
        id: audit
        # `--audit-level=critical` makes npm audit exit non-zero on critical.
        # The 14 high-severity CVEs need dedicated bump tickets (Notion
        # backlog). The 2 critical CVEs are addressed inline.
        run: |
          set +e
          npm audit --json --audit-level=critical > npm-audit.json
          rc=$?
          set -e
          echo "exit_code=$rc"
          echo "audit_json_path=npm-audit.json"

      - name: Upload audit artifact
        if: always()
        # Always upload, even on failure — reviewers need to see WHICH
        # CVEs triggered the gate.
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30

      - name: Fail on critical CVEs
        if: always()
        # Final grep makes the failure reason explicit in the job log.
        run: |
          if [ -s npm-audit.json ] && grep -qE '"severity":"critical"' npm-audit.json; then
            echo "::error::npm audit found CRITICAL CVEs in the dependency tree. See the npm-audit-report artifact for the full list."
            echo "==== Top advisories ===="
            node -e "
              const a = require('./npm-audit.json');
              const adv = (a.vulnerabilities || {});
              const names = Object.entries(adv)
                .filter(([, v]) => v.severity === 'critical')
                .map(([name, v]) => \`- \${name} [\${v.severity}] via \${v.via[0]?.title || v.via[0]?.name || 'see advisory'}\`);
              console.log(names.join('\n'));
            " || true
            exit 1
          else
            echo "npm audit: no CRITICAL CVEs. OK."
          fi
