name: Mobile native build check
on:
  pull_request:
    paths:
      - 'capacitor.config.ts'
      - 'src/**'
      - 'android/**'
      - 'packages/**'
      - 'fastlane/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  android-build-check:
    name: Compile native debug candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm install -g npm@12 && npm ci --ignore-scripts
      - name: Release guard regressions
        run: |
          node --test scripts/__tests__/android-release.test.cjs
          python3 scripts/__tests__/test_android_16kb.py
      - name: Build web bundle
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SLM_PREPACKAGE_SKIP: '1'
      - name: Capacitor sync
        run: npx cap sync android
        env:
          NODE_ENV: production
      - name: Store configuration check
        run: npm run guard:store-build
      - name: Compile native Android and run native unit tests
        run: node scripts/run-gradle.cjs assembleDebug testDebugUnitTest --no-daemon
