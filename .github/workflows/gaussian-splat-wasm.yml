name: Gaussian splat WASM

on:
  pull_request:
    paths:
      - 'wasm/gaussian-splat/**'
      - '.github/workflows/gaussian-splat-wasm.yml'
  push:
    branches: [main]
    paths:
      - 'wasm/gaussian-splat/**'
      - '.github/workflows/gaussian-splat-wasm.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wasm/gaussian-splat
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown --component rustfmt --component clippy
      - name: Check, build and exercise the WASM artifact
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-unknown-unknown --locked --offline -- -D warnings
          cargo build --release --target wasm32-unknown-unknown --locked --offline
          node --test tests/*.test.cjs
