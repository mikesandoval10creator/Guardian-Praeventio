name: Gaussian splat WASM

on:
  pull_request:
    paths:
      - 'wasm/gaussian-splat/**'
      - '.github/workflows/gaussian-splat-wasm.yml'
      - 'src/server/middleware/securityHeaders.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
  push:
    branches: [main]
    paths:
      - 'wasm/gaussian-splat/**'
      - '.github/workflows/gaussian-splat-wasm.yml'
      - 'src/server/middleware/securityHeaders.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wasm/gaussian-splat
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown --component rustfmt --component clippy
      - name: Check, build and exercise the WASM artifact
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-unknown-unknown --locked --offline -- -D warnings
          cargo build --release --target wasm32-unknown-unknown --locked --offline
          node --test tests/*.test.mjs
      - name: Install browser test dependencies
        working-directory: .
        run: |
          npm ci --no-audit --no-fund
          # Use the same Playwright package the probe imports, not a hoisted transitive CLI.
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Check the bundled WASM worker and canvas in Chromium
        working-directory: .
        env:
          NODE_ENV: production
        run: node wasm/gaussian-splat/tests/browser/run.mjs
