apply plugin: 'com.android.application'

import java.util.Properties

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingValue = { String propertyName, String envName ->
    def injectedPropertyName = "android.injected.signing.${propertyName}"
    if (project.hasProperty(injectedPropertyName)) {
        return project.property(injectedPropertyName)?.toString()
    }
    if (keystoreProperties[propertyName]) {
        return keystoreProperties[propertyName].toString()
    }
    return System.getenv(envName)
}

android {
    namespace = "com.praeventio.guard"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.praeventio.guard"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // VERSION_CODE: read from env (CI injects github.run_number) or default to 1.
        // Without this, Google Play rejects a 2nd AAB because versionCode is static.
        versionCode System.getenv("VERSION_CODE")?.toInteger() ?: 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def releaseStoreFile = signingValue('store.file', 'KEYSTORE_PATH')
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
            }
            storePassword signingValue('store.password', 'ANDROID_KEYSTORE_PASSWORD')
            keyAlias signingValue('key.alias', 'KEY_ALIAS')
            keyPassword signingValue('key.password', 'KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Debug remains usable without production Firebase/signing inputs.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// Covers IDE, Fastlane and direct wrapper invocations, including -x preReleaseBuild.
// Signing values stay in the child environment, never in command-line output.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') && !it.name.toLowerCase().startsWith('clean') }) {
        def signing = android.signingConfigs.release
        def result = providers.exec {
            workingDir rootProject.projectDir.parentFile
            commandLine 'node', 'scripts/check-android-release.cjs'
            environment 'KEYSTORE_PATH', signing.storeFile?.absolutePath ?: ''
            environment 'ANDROID_KEYSTORE_PASSWORD', signing.storePassword ?: ''
            environment 'KEY_ALIAS', signing.keyAlias ?: ''
            environment 'KEY_PASSWORD', signing.keyPassword ?: ''
            ignoreExitValue = true
        }.result.get()
        if (result.exitValue != 0) throw new GradleException('Android release inputs rejected; see guard failures above.')
    }
}
